[mypy]

allow_redefinition = True
check_untyped_defs = True
disallow_any_decorated = True
disallow_any_generics = True
disallow_any_unimported = True
disallow_incomplete_defs = True
disallow_subclassing_any = True
disallow_untyped_decorators = True
disallow_untyped_defs = True
strict_equality = True
warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_ignores = True

enable_error_code = deprecated, exhaustive-match, ignore-without-code, possibly-undefined, redundant-expr, redundant-self, truthy-bool, unused-awaitable

exclude = venv/

[mypy-tests.*]
disallow_untyped_defs = False

# Example apps memoize numpy arrays (`@pa.memoize def f() -> np.ndarray`), and
# numpy's array type contains `Any` (its shape and dtype parameters).
[mypy-example_dataset_algorithm,example_fft,example_filter,example_freq]
disallow_any_decorated = False
