  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          # 32-bit `x86` was also generated here originally and dropped
          # alongside Linux `x86` above, for the same reason (see the Linux
          # job's comment) — not independently re-verified for Windows.
          # The newer template also builds `aarch64` on windows-11-arm; not
          # adopted (yet) — a new platform to support and test, not a fix.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.10 python3.11 python3.12 python3.13 python3.14 # keep in line with xref:supported-python-versions
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          # Generated default was macos-13 for x86_64; GitHub deprecated
          # that runner image, so both rows now use macos-14 (aarch64,
          # cross-compiling to x86_64 for the first row). The newer template
          # builds x86_64 natively on macos-15-intel instead; not adopted
          # (yet), since cross-compiling works.
          - runner: macos-14
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.10 python3.11 python3.12 python3.13 python3.14 # keep in line with xref:supported-python-versions
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Replaces the generated tag-triggered release: runs on every run, and
  # scripts/release_if_untagged decides. On a push to main whose Cargo.toml
  # version has no tag yet, it publishes this run's artifacts and creates the
  # tag; anywhere else (PRs, already-released versions) it's a dry run /
  # no-op, so the release path is exercised before it matters.
  # Template features not adopted (yet): `actions/attest` artifact
  # attestations, and PyPI trusted publishing (OIDC) instead of the
  # long-lived PYPI_API_TOKEN -- the latter needs a trusted publisher to be
  # configured on PyPI's side first.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist] # musllinux
    permissions:
      contents: write # to push the release tag
    # Two quick merges must not both see the version as untagged at once.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI and tag (dry run unless a push to main)
        env:
          # Only handed to runs that can actually release.
          UV_PUBLISH_TOKEN: ${{ env.IS_RELEASE == 'true' && secrets.PYPI_API_TOKEN || '' }}
        run: |
          . env.sh
          ./scripts/release_if_untagged $([[ "$IS_RELEASE" == "true" ]] && echo --push) artifacts/wheels-*/*
