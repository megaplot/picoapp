name: deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          # 32-bit `x86` was also generated here originally and dropped when
          # switching from cushy to gpui-kit for the UI: cross-compiling
          # gpui's C-FFI windowing deps (e.g. wayland-backend's C shim) for
          # i686 needs 32-bit system headers/libs that aren't reliably
          # available, the same class of problem as the targets disabled
          # below. Not independently confirmed as a hard blocker (vs. just
          # not worth the effort) — 32-bit desktop Linux is a vanishingly
          # small target today either way.
          # TODO: Try to make cross compilation work again...
          # - runner: ubuntu-latest
          #   target: aarch64
          # - runner: ubuntu-latest
          #   target: armv7
          # - runner: ubuntu-latest
          #   target: s390x
          # - runner: ubuntu-latest
          #   target: ppc64le
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.10 python3.11 python3.12 python3.13 python3.14 # keep in line with xref:supported-python-versions
          sccache: 'true'
          # Generated default was `auto` (manylinux2014, CentOS 7-based):
          # its yum repos don't carry libxkbcommon-x11-devel/wayland-devel/
          # fontconfig-devel at all (Wayland and modern xkbcommon-x11
          # postdate CentOS 7), which gpui's Linux windowing backend needs.
          # manylinux_2_28 (AlmaLinux 8-based) has them — see the yum
          # install list in the x86_64 case below.
          manylinux: 2_28
          before-script-linux: |
            echo "Running before-script-linux for target: ${{ matrix.platform.target }}"
            uname -a
            cat /etc/*-release
            case "${{ matrix.platform.target }}" in
              "aarch64" | "s390x" | "ppc64le")
                # NOTE: pypa/manylinux docker images are Debian based
                sudo apt-get update
                sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-x11-dev \
                  libwayland-dev libx11-xcb-dev libfontconfig-dev clang
                ;;
              "armv7")
                # Probably requires something more like this:
                # https://askubuntu.com/a/1323570/161463
                sudo dpkg --add-architecture armhf
                sudo sed -i "s/deb h/deb [arch=amd64] h/g" /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy universe" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates universe" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy multiverse" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates multiverse" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security universe" >> /etc/apt/sources.list
                sudo echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security multiverse" >> /etc/apt/sources.list
                sudo apt-get update
                sudo apt-get install -y libasound2-dev:armhf libdbus-1-dev:armhf
                export PKG_CONFIG_ALLOW_CROSS=1
                ;;
              "x86_64")
                # NOTE: rust-cross/manylinux docker images are CentOS based
                yum update -y
                yum install -y alsa-lib-devel dbus-devel libxkbcommon-x11-devel \
                  wayland-devel libxcb-devel fontconfig-devel clang
                ;;
            esac
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

