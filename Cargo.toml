[package]
name = "picoapp"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "picoapp"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
gpui-kit = "=0.7.0"
image = "0.25.10"
log = "0.4.34"
pyo3 = "0.29.2"
rodio = "0.22.2"
smallvec = "1.16.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }

# Debug builds of gpui/wgpu (and other heavy graphics deps) are unusably slow
# without this; only our own crate keeps the default (unoptimized) profile.
[profile.dev.package."*"]
opt-level = 2
