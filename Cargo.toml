[package]
name = "picoapp"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "picoapp"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
futures = "0.3"
gpui-kit = "=0.6.6"
image = "0.25"
log = "0.4"
pyo3 = "0.22"
rodio = "0.19.0"
smallvec = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }

# Debug builds of gpui/wgpu (and other heavy graphics deps) are unusably slow
# without this; only our own crate keeps the default (unoptimized) profile.
[profile.dev.package."*"]
opt-level = 2
