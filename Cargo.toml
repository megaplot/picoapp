[package]
name = "picoapp"
version = "0.2.1"
edition = "2024"

[lib]
name = "picoapp"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
gpui-kit = "=0.6.6"
futures = "0.3"
log = "0.4"
pyo3 = "0.22"
rodio = "0.19.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
